# Weekly update pull requests for dependencies, base images and CI actions;
# security fixes arrive as soon as they are published. Major versions of Node
# (base images, @types/node) are chosen by hand: odd majors are not LTS.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
