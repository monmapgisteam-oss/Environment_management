# The whole system: reverse proxy -> frontend (Next.js) and backend (Fastify,
# which alone talks to the ArcGIS feature service). Only the proxy publishes
# a port. Secrets come from .env (see .env.example).
#
#   docker compose up -d --build
#   open http://localhost:8080

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Only the values the app needs, read from .env. The ArcGIS owner token
    # (ARCGIS_ADMIN_TOKEN) is for provisioning scripts and never enters here.
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ARCGIS_PORTAL_URL: ${ARCGIS_PORTAL_URL:?set ARCGIS_PORTAL_URL in .env}
      ARCGIS_DATA_SERVICE_URL: ${ARCGIS_DATA_SERVICE_URL:?set ARCGIS_DATA_SERVICE_URL in .env}
      ARCGIS_CLIENT_ID: ${ARCGIS_CLIENT_ID:?set ARCGIS_CLIENT_ID in .env}
      ARCGIS_CLIENT_SECRET: ${ARCGIS_CLIENT_SECRET:?set ARCGIS_CLIENT_SECRET in .env}
      ARCGIS_HTTP_REFERER: ${ARCGIS_HTTP_REFERER:-}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      # Proxies that append to X-Forwarded-For: nginx, plus any TLS
      # terminator in front of it.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    networks: [internal, egress]
    mem_limit: 768m
    pids_limit: 256
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:4000
    # The frontend holds no secrets and needs no internet access.
    networks: [internal]
    mem_limit: 768m
    pids_limit: 256
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /app/frontend/.next/cache]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Behind a TLS terminator on the same machine, set HTTP_BIND=127.0.0.1 so
    # nobody can reach the proxy around it (and fake X-Forwarded-For).
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    networks: [internal, edge]
    mem_limit: 128m
    pids_limit: 128
    depends_on:
      frontend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  # Between the three containers only; no outside access.
  internal:
    internal: true
  # Outbound access for the backend (ArcGIS).
  egress: {}
  # The published port.
  edge: {}
