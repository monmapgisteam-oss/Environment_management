# Reverse proxy in front of the app: the only container with a published
# port. /api goes to the backend, everything else to the frontend.

# Behind a load balancer / TLS terminator, take the client address from it,
# so the limits below are per visitor, not one bucket for everyone:
#   set_real_ip_from <terminator address or CIDR>;
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;

# Login and sign-up get an extra per-address limit here, on top of the
# backend's own counters.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Every API call and page, per address. Generous, because a whole office may
# share one address; it stops scripted floods, not people.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pages:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Access log without query strings: file links carry a bearer token there.
log_format noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent"';

# Keep the protocol of a TLS terminator in front of this proxy, if any.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

upstream frontend {
  server frontend:3000;
  keepalive 16;
}

upstream backend {
  server backend:4000;
  keepalive 16;
}

server {
  listen 8080;
  server_tokens off;
  access_log /dev/stdout noquery;

  # One uploaded file (25 MB) with its multipart envelope.
  client_max_body_size 27m;
  client_body_timeout 60s;
  client_header_timeout 15s;
  send_timeout 60s;
  keepalive_timeout 30s;
  large_client_header_buffers 4 16k;
  limit_conn perip 100;
  limit_req_status 429;
  limit_conn_status 429;

  # Headers that only describe the software behind the proxy.
  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;

  # Only the methods the app uses.
  if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE)$) { return 405; }

  # Hidden files (.env, .git, ...) are never served, whatever is mounted.
  location ~ /\. { return 404; }

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  # $http_host keeps a non-default port, which the backend's same-origin
  # check compares with the browser's Origin.
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;

  # Paths are matched without case: the backend only serves lowercase /api,
  # and nothing that looks like /api may reach the frontend instead.

  # Page views and the session lookup are for the frontend server only.
  location ~* ^/+api/+views(/|$) { return 404; }
  location ~* ^/+api/+auth/+me/*$ { return 404; }

  location ~* ^/+api/+auth/+(login|signup)/*$ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://backend;
  }

  location ~* ^/+api(/|$) {
    limit_req zone=api burst=120 nodelay;
    # Stream uploads to the backend instead of buffering them on disk.
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://backend;
  }

  # Built scripts and styles: no rate limit (a page loads many at once).
  location ^~ /_next/static/ {
    proxy_pass http://frontend;
  }

  location / {
    limit_req zone=pages burst=100 nodelay;
    proxy_read_timeout 60s;
    proxy_pass http://frontend;
  }
}
