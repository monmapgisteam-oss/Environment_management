# Reverse proxy in front of the app: the only container with a published
# port. /api goes to the backend, everything else to the frontend.

# Login and sign-up get an extra per-address limit here, on top of the
# backend's own counters.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# Keep the protocol of a TLS terminator in front of this proxy, if any.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

upstream frontend {
  server frontend:3000;
  keepalive 16;
}

upstream backend {
  server backend:4000;
  keepalive 16;
}

server {
  listen 8080;
  server_tokens off;

  # One uploaded file (25 MB) with its multipart envelope.
  client_max_body_size 27m;
  client_body_timeout 60s;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;

  # Page views and the session lookup are for the frontend server only.
  location ^~ /api/views/ { return 404; }
  location = /api/auth/me { return 404; }

  location ~ ^/api/auth/(login|signup)$ {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://backend;
  }

  location /api/ {
    # Stream uploads to the backend instead of buffering them on disk.
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://backend;
  }

  location / {
    proxy_read_timeout 60s;
    proxy_pass http://frontend;
  }
}
